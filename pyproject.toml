[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-tui"
version = "0.2.0"
description = "A terminal calculator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["colorama>=0.4.6"]

[project.scripts]
calculator-tui = "calc_tui:main"

[tool.setuptools]
py-modules = ["calc_tui"]