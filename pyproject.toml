[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-calculator"
version = "0.1.0"
description = "A terminal calculator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["colorama>=0.4.6"]

[project.scripts]
advanced-calc = "advanced_calc:main"

[tool.setuptools]
py-modules = ["advanced_calc"]